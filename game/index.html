<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Velvet Vault — The Midnight Heist: an original top-down stealth heist game. Sneak past guards and cameras, crack the vault, grab the loot and escape.">
<title>Velvet Vault — The Midnight Heist</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #070a12;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
  }
  #wrap {
    width: min(100vw, calc(100vh * 1280 / 720));
    aspect-ratio: 1280 / 720;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: auto;
    cursor: crosshair;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720" tabindex="0" aria-label="Velvet Vault — top-down heist game. Move with WASD or arrow keys."></canvas></div>
<noscript><p style="color:#e8e4d8;text-align:center">Velvet Vault needs JavaScript to run.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
